[package]
name = "bundler"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
cargo_metadata = "0.18.1"
clap = { version = "4.5.19", features = ["derive"] }
proc-macro2 = { version = "1.0.87", features = ["span-locations"] }
quote = "1.0.33"
serde = { version = "1.0.210", features = ["serde_derive"] }
syn = { version = "2.0.42", features = ["full", "extra-traits", "visit-mut"] }
toolchain_find = "0.4.0"
