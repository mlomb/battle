[package]
name = "battle-bundler"
version = "0.0.2"
edition = "2021"
resolver = "2"
description = "Bundle C++ and Rust bot projects into a single source unit for submission"
license = "MIT"
repository = "https://github.com/mlomb/battle"

[dependencies]
cargo_metadata = "0.23.1"
clap = { version = "4.6.1", features = ["derive"] }
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
quote = "1.0.45"
serde = { version = "1.0.228", features = ["derive"] }
syn = { version = "2.0.117", features = ["full", "visit-mut", "extra-traits"] }
toolchain_find = "0.4.0"

[dev-dependencies]
assert_cmd = "2"
build-fs-tree = "0.8.1"
tempfile = "3"
