[package]
name = "battle"
version = "0.1.0"
edition = "2024"
description = "Tools for building competitive bots"
license = "MIT"
repository = "https://github.com/mlomb/battle"
categories = ["command-line-utilities","development-tools"]
keywords = ["bots","codingame"]

[dependencies]
clap = { version = "4.5.19", features = ["derive", "env"] }
bundler = { path = "../bundler" }
wrapcmd = { path = "../wrapcmd" }
cgsync = { path = "../cgsync" }
console = { version = "0.16.3", default-features = false, features = ["ansi-parsing", "std"] }
tempfile = "3.27.0"
build-fs-tree = "0.8.1"
serde = { version = "1.0.228", features = ["serde_derive"] }
num_cpus = "1.17.0"
env_logger = "0.11.10"
log = "0.4.29"
futures-util = "0.3.32"
blake3 = "1.8.4"
async-channel = "2.5.0"
anyhow = "1.0.102"
postcard = { version = "1.1.3", features = ["alloc"] }
tokio = { version = "1.51.1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "net", "signal"] }
rand = "0.10.1"
message-io = "0.19.0"
include_dir = "0.7.4"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
win32job = "2"

[dev-dependencies]
assert_cmd = "2"
send_ctrlc = "0.6.0"
