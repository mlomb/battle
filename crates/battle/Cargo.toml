[package]
name = "battle"
version = "0.0.2"
edition = "2024"
authors = ["mlomb <hello@mlomb.dev>"]
description = "Tools for building competitive bots"
license = "MIT"
repository = "https://github.com/mlomb/battle"
categories = ["command-line-utilities","development-tools"]
keywords = ["bots","codingame"]
readme = "../../README.md"

[dependencies]
clap = { version = "4.5.19", features = ["derive", "env"] }
battle-bundler = { path = "../bundler", version = "0.0.2" }
battle-wrapcmd = { path = "../wrapcmd", version = "0.0.2" }
battle-cgsync = { path = "../cgsync", version = "0.0.2" }
battle-cgapi = { path = "../cgapi", version = "0.0.2" }
console = { version = "0.16.3", default-features = false, features = ["ansi-parsing", "std"] }
tempfile = "3.27.0"
build-fs-tree = "0.8.1"
serde = { version = "1.0.228", features = ["serde_derive"] }
serde_json = "1.0"
num_cpus = "1.17.0"
env_logger = "0.11.10"
log = "0.4.29"
futures-util = "0.3.32"
blake3 = "1.8.4"
async-channel = "2.5.0"
anyhow = "1.0.102"
postcard = { version = "1.1.3", features = ["alloc"] }
similar = "2"
tokio = { version = "1.51.1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "net", "signal"] }
rand = "0.10.1"
message-io = "0.19.0"
include_dir = "0.7.4"
rmcp = { version = "1.7", features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars = { version = "1.2", features = ["derive"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
win32job = "2"

[dev-dependencies]
assert_cmd = "2"
send_ctrlc = "0.6.0"
