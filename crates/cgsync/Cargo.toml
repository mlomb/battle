[package]
name = "cgsync"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
notify = "6.1.1"
serde_json = "1.0.108"
bundler = { path = "../bundler" }
clap = { version = "4.4.11", features = ["derive"] }
tokio-tungstenite = "0.21.0"
futures-util = "0.3.30"
tokio = { version = "1.35.1", features = ["io-std", "macros", "net", "rt-multi-thread", "time", "sync"] }
console = "0.15.8"
indicatif = "0.17.8"
