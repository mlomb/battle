[package]
name = "cgsync"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
notify = "8.2"
serde_json = "1.0"
bundler = { path = "../bundler" }
clap = { version = "4", features = ["derive"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio = { version = "1.35", features = ["macros", "net", "rt-multi-thread", "signal", "time", "sync"] }
console = "0.16"
indicatif = { version = "0.18", default-features = false }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
build-fs-tree = "0.8.1"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
serial_test = "3.4.0"
