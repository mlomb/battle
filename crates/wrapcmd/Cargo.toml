[package]
name = "battle-wrapcmd"
version = "0.0.1"
edition = "2021"
resolver = "2"
description = "Run commands under OS job/process limits for sandboxed bot toolchains"
license = "MIT"
repository = "https://github.com/mlomb/battle"

[dependencies]
clap = { version = "4.5.19", features = ["derive"] }
console = "0.16.3"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[target."cfg(windows)".dependencies]
win32job = "2"
